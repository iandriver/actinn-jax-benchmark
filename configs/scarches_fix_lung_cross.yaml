# scArches configuration check on the split where the native classifier head fails:
# HLCA -> krasnow, the same cross-dataset split as configs/paper.yaml. ArchMap reports
# scANVI's native head at 0.18 macro-F1 on the HLCA; the paper run scored 0.178 here.
label: cell_type
repeats: 3
output: results/scarches_fix_lung_cross
save_predictions: true
ontology_obo: /tmp/cl-basic.obo

datasets:
  # source: HLCA, Sikkema et al. 2023 (doi:10.1038/s41591-023-02327-2) -> Travaglini 2020
  - name: lung_cross
    type: cross
    ref_path: ~/Downloads/Sikkema_HLCA.h5ad
    query_path: ~/Downloads/krasnow_lung_atlas_10x.h5ad
    ref_subsample_per_label: 300
    query_subsample_per_label: 400

methods:
  - name: scarches
    python: .venv-scvi/bin/python
  - name: scarches-native
    python: .venv-scvi/bin/python
