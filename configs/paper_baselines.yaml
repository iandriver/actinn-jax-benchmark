# Fills the paper matrix so every method covers every dataset (no one-off gaps).
# Datasets are IDENTICAL to configs/paper.yaml, so the seeded splits reproduce
# byte-for-byte and these rows merge directly into results/paper for §3.1/§3.2.
# Only the three methods added after the original panel are run here:
#   linear-anova-pca, scTOP, ProtoCloud.
# Launch with the protocloud venv (has torch + sklearn + scanpy + actinn_jax):
#   .venv-protocloud/bin/python -m benchmark.driver configs/paper_baselines.yaml
label: cell_type
repeats: 3
output: results/paper_baselines
ontology_obo: /tmp/cl-basic.obo

datasets:
  - name: pbmc                 # ~2k cells, 8 types, symbols
    type: builtin
    builtin: pbmc3k
  - name: liver_cross          # HLiCA cross-study (train 6 studies -> test Andrews_2022)
    type: cross
    ref_path: /Volumes/IanSSD/hlica/liver_ref_xstudy.h5ad
    query_path: /Volumes/IanSSD/hlica/liver_query_xstudy.h5ad
  - name: liver_intra          # HLiCA within-dataset, ~36 types
    type: intra
    path: /Volumes/IanSSD/hlica/liver_intra.h5ad
    test_frac: 0.25
  - name: blood_gut_intra      # high cardinality, 86 types (no CL id -> no ontology score)
    type: intra
    path: /Volumes/IanSSD/hlica/blood_gut_intra.h5ad
    test_frac: 0.25
  - name: lung_intra           # krasnow within-dataset, 46 types
    type: intra
    path: ~/Downloads/krasnow_lung_atlas_10x.h5ad
    subsample_per_label: 300
    test_frac: 0.25
  - name: lung_cross           # HCLA -> krasnow, cross-dataset (hard)
    type: cross
    ref_path: ~/Downloads/Sikkama_HCLA.h5ad
    query_path: ~/Downloads/krasnow_lung_atlas_10x.h5ad
    ref_subsample_per_label: 300
    query_subsample_per_label: 400

methods:
  - name: linear-anova-pca
  - name: sctop
  - name: protocloud
