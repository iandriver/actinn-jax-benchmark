# scArches configuration check on the shared-vocabulary splits. lung_intra reproduces
# the paper's split exactly (10,803 cells). The liver splits do not: the rebuilt splits
# carry 38 cell types and 300 more cells per split than the paper run's 36. Why the
# historical input had 36 is unresolved; both published HLiCA versions have 38, and the
# counts alone do not establish what the paper read. The corrected-vs-native comparison
# is unaffected, since both run on the identical rebuilt inputs; the published liver row
# is not a valid cross-check.
# Source files, if missing, redownload with:
#   curl -fL -o ~/Downloads/Sikkema_HLCA.h5ad \
#     https://datasets.cellxgene.cziscience.com/688185ad-11c2-4172-a53a-f4f1f4076860.h5ad
#   curl -fL -o ~/Downloads/krasnow_lung_atlas_10x.h5ad \
#     https://datasets.cellxgene.cziscience.com/f5568ea3-c249-4e4e-91f8-46abc30a5612.h5ad
# HLCA core (584,944 cells, 5.87 GB) and Krasnow 10X (65,662 cells, 0.60 GB). Both
# reproduce this config's split sizes exactly: 14,390 / 13,550 and 10,803.
label: cell_type
repeats: 3
output: results/scarches_fix_rest
save_predictions: true
ontology_obo: /tmp/cl-basic.obo

datasets:
  # source: Travaglini et al. 2020, doi:10.1038/s41586-020-2922-4
  - name: lung_intra
    type: intra
    path: ~/Downloads/krasnow_lung_atlas_10x.h5ad
    subsample_per_label: 300
    test_frac: 0.25
  # source: HLiCA, Edgar et al. 2026, doi:10.64898/2026.06.30.735539
  - name: liver_intra
    type: intra
    path: /Volumes/IanSSD/hlica/liver_intra.h5ad
    test_frac: 0.25
  - name: liver_cross
    type: cross
    ref_path: /Volumes/IanSSD/hlica/liver_ref_xstudy.h5ad
    query_path: /Volumes/IanSSD/hlica/liver_query_xstudy.h5ad

methods:
  - name: scarches
    python: .venv-scvi/bin/python
  - name: scarches-native
    python: .venv-scvi/bin/python
