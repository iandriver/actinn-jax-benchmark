# actinn-jax vs ProtoCloud head-to-head. Intra datasets subsampled per label to keep
# ProtoCloud's CPU VAE training tractable (both methods see the same subsample, so the
# accuracy comparison is fair; ProtoCloud's fit time reflects CPU -- it targets GPU).
output: results/protocloud_compare
label: cell_type
repeats: 3
ontology_obo: null
datasets:
  - name: pbmc3k_intra
    type: builtin
    builtin: pbmc3k
    test_frac: 0.25
  - name: lung_intra
    type: intra
    path: ~/Downloads/krasnow_lung_atlas_10x.h5ad
    subsample_per_label: 300
    test_frac: 0.25
  - name: liver_intra
    type: intra
    path: /Volumes/IanSSD/hlica/liver_intra.h5ad
    subsample_per_label: 300
    test_frac: 0.25
  - name: blood_gut_intra
    type: intra
    path: /Volumes/IanSSD/hlica/blood_gut_intra.h5ad
    subsample_per_label: 200
    test_frac: 0.25
methods:
  - name: actinn-jax
  - name: protocloud
