# Single source of truth for every citation in the paper.
#
# `tools/check_references.py` enforces that:
#   * every method in PAPER.md section 2.2 has a `cite:` key here
#   * every dataset in section 2.3 has one
#   * every [Key] used inline resolves to an entry
#   * no entry is unresolved (status: unresolved fails the check)
#
# `manuscript/build_manuscript.py` generates the numbered reference list from this file,
# so the list cannot drift from what the text actually cites.
#
# status:
#   verified   — bibliographic details checked against the publisher record
#   software   — a tool/repo with no paper; cite the artifact
#   unresolved — WE DO NOT KNOW the source. Fails the check. Do not guess a citation:
#                a wrong dataset attribution is worse than an admitted gap.

methods:
  actinn-jax:
    cite: Ma & Pellegrini 2020
    note: actinn-jax reimplements ACTINN; this is the original method paper
  SVM:
    cite: Pedregosa 2011
  kNN:
    cite: Pedregosa 2011
  CellTypist:
    cite: Domínguez Conde 2022
  linear-anova-pca:
    cite: Pedregosa 2011
    note: baseline assembled here from scikit-learn components; no separate paper
  scTOP:
    cite: Yampolskaya 2023
  SingleR:
    cite: Aran 2019
  scmap-cluster:
    cite: Kiselev 2018
  scANVI:
    cite: Xu 2021
  scArches:
    cite: Lotfollahi 2022
  ProtoCloud:
    cite: Guo & Ding 2026
  scPRINT:
    cite: Kalfon 2025
  Pan-human Azimuth:
    cite: Sarkar et al. 2026

datasets:
  lung_intra:
    cite: Travaglini 2020
  lung_cross:
    cite: [Sikkema 2023, Travaglini 2020]
    note: HLCA (reference) -> Travaglini/Krasnow (query)
  liver_intra:
    cite: Edgar 2026
  liver_cross:
    cite: Edgar 2026
  blood_gut_intra:
    cite: Alegbe 2026
    note: >
      IBDverse (ibdverse.info, Wellcome Sanger Institute / Anderson Lab). Matched on
      three independent signals: the sanger_sample_id column, the blood / ti / r tissue
      codes against the study's blood + terminal ileum + rectum design, and the
      immune+epithelial+mesenchymal lineage set. Our file is a subsample; IBDverse also
      backs two further papers (ileal inflammation; blood-vs-gut immune comparison), so
      cite the atlas paper unless a specific released object is being referenced.
  pbmc:
    cite: 10x Genomics 2016

